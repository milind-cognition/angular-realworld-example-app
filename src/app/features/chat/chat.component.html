<div class="chat-container">
  <div class="chat-header">
    <h1>Belmont Shore Happy Hour Bot</h1>
    <p>Find happy hours in Belmont Shore, Naples & 2nd & PCH</p>
  </div>

  <div class="messages-container" #messagesContainer>
    <div
      *ngFor="let message of messages"
      class="message"
      [ngClass]="{
        'user-message': message.type === 'user',
        'bot-message': message.type === 'bot',
      }"
    >
      <div class="message-avatar">
        <span *ngIf="message.type === 'user'">You</span>
        <span *ngIf="message.type === 'bot'">Bot</span>
      </div>
      <div class="message-content">
        <div
          class="message-text"
          [innerHTML]="formatMessageContent(message.content)"
        ></div>
        <div class="message-time">
          {{ message.timestamp | date: "shortTime" }}
        </div>
      </div>
    </div>

    <div *ngIf="isLoading" class="message bot-message loading-message">
      <div class="message-avatar">
        <span>Bot</span>
      </div>
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="suggested-questions" *ngIf="messages.length <= 1">
    <p>Try asking:</p>
    <div class="suggestions-list">
      <button
        *ngFor="let question of suggestedQuestions"
        class="suggestion-btn"
        (click)="askSuggestedQuestion(question)"
      >
        {{ question }}
      </button>
    </div>
  </div>

  <div class="input-container">
    <textarea
      [(ngModel)]="userInput"
      (keypress)="onKeyPress($event)"
      placeholder="Ask about happy hours..."
      rows="1"
      [disabled]="isLoading"
    ></textarea>
    <button
      class="send-btn"
      (click)="sendMessage()"
      [disabled]="!userInput.trim() || isLoading"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
